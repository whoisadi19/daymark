[package]
name = "daymark"
version = "1.0.0"
description = "DAYMARK — Personal Execution & Desk Telemetry"
authors = ["adi"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "daymark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-log = "2"
